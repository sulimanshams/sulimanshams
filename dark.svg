<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Suliman Shams — Frontend Developer (dark)</title>
  <defs>
    <!-- Background animated gradient -->
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#071124">
        <animate attributeName="stop-color" dur="8s" values="#071124;#0b1b2b;#071124" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#081426">
        <animate attributeName="stop-color" dur="10s" values="#081426;#0b2840;#081426" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle glowing radial accent -->
    <radialGradient id="glow" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.25">
        <animate attributeName="stop-opacity" dur="6s" values="0.18;0.28;0.18" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1b2b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft blur for glow -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tiny particles pattern -->
    <g id="particle">
      <circle cx="0" cy="0" r="2" fill="#88f0ff" opacity="0.18"/>
    </g>

    <!-- Styles -->
    <style><![CDATA[
      .bg-rect { fill: url(#bgGrad); }
      .glow-rect { fill: url(#glow); opacity: 0.9; }
      .floating { transform-origin: center; animation: float 6s ease-in-out infinite; }
      .floating.slow { animation-duration: 9s; }
      .floating.fast { animation-duration: 4.5s; }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      .title { font-family: Inter, Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; font-weight: 700; font-size: 36px; }
      .role { font-family: Inter, Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cfeffd; font-weight: 600; font-size: 16px; }
      .tagline { font-family: Inter, Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9fcbe0; font-size: 14px; opacity: 0.95; }

      .tech-pill { font-family: Inter, Roboto, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #021017; }
      .pill-bg { rx: 14; ry: 14; }

      .fade-in { animation: appear 1s ease-out 0.5s both; }
      @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

      .line { stroke: rgba(97,218,251,0.12); stroke-width: 1.2; stroke-linecap: round; }
      .dash { stroke: rgba(97,218,251,0.18); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 8 6; animation: dashmove 6s linear infinite; }
      @keyframes dashmove { to { stroke-dashoffset: -30; } }

    ]]></style>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="1200" height="300" rx="8"/>
  <!-- Glow accent -->
  <rect x="0" y="0" width="1200" height="300" class="glow-rect" filter="url(#blur)" />

  <!-- Decorative flowing line -->
  <g transform="translate(60,40)">
    <path class="line" d="M0,180 C180,100 360,40 600,120 C840,200 980,60 1140,120" fill="none"/>
    <path class="dash" d="M0,180 C180,100 360,40 600,120 C840,200 980,60 1140,120" fill="none"/>
  </g>

  <!-- Floating particles (cloned) -->
  <g transform="translate(980,40)" class="floating slow" opacity="0.9">
    <use href="#particle" x="0" y="0"/>
    <use href="#particle" x="24" y="-12"/>
    <use href="#particle" x="-18" y="8"/>
  </g>

  <g transform="translate(110,60)" class="floating fast" opacity="0.9">
    <use href="#particle" x="0" y="0"/>
    <use href="#particle" x="42" y="24"/>
    <use href="#particle" x="-26" y="18"/>
  </g>

  <!-- Content: left side text -->
  <g transform="translate(60,95)" class="fade-in">
    <text x="0" y="0" class="title">Suliman Shams</text>
    <text x="0" y="36" class="role">Frontend Developer</text>
    <text x="0" y="68" class="tagline">Building modern, responsive, and user-friendly web experiences</text>

    <!-- Tech pills -->
    <g transform="translate(0,98)">
      <g transform="translate(0,0)">
        <rect class="pill-bg" x="0" y="0" width="150" height="36" fill="#61DAFB" />
        <text x="18" y="24" class="tech-pill">React</text>
      </g>

      <g transform="translate(170,0)">
        <rect class="pill-bg" x="0" y="0" width="170" height="36" fill="#3178C6" />
        <text x="18" y="24" class="tech-pill" fill="#ffffff">TypeScript</text>
      </g>

      <g transform="translate(350,0)">
        <rect class="pill-bg" x="0" y="0" width="150" height="36" fill="#FFFFFF" opacity="0.08" />
        <text x="18" y="24" class="tech-pill" fill="#e6f7ff">Next.js</text>
      </g>
    </g>
  </g>

  <!-- Right side: subtle code-like card -->
  <g transform="translate(750,40)" opacity="0.96" class="fade-in">
    <rect x="0" y="0" width="360" height="200" rx="12" fill="#06121a" opacity="0.18" />
    <!-- small header lines -->
    <rect x="16" y="18" width="120" height="10" rx="5" fill="#7de3ff" opacity="0.12"/>
    <rect x="16" y="36" width="220" height="8" rx="4" fill="#7de3ff" opacity="0.08"/>

    <!-- mock code lines -->
    <g transform="translate(20,68)" fill="#9fdff6" opacity="0.9">
      <rect x="0" y="0" width="320" height="8" rx="4" fill="#0e2c36" opacity="0.16"/>
      <rect x="0" y="18" width="280" height="8" rx="4" fill="#0e2c36" opacity="0.14"/>
      <rect x="0" y="36" width="240" height="8" rx="4" fill="#0e2c36" opacity="0.12"/>
    </g>

    <!-- floating code particle -->
    <g transform="translate(290,12)" class="floating slow" opacity="0.9">
      <circle cx="0" cy="0" r="6" fill="#61DAFB" opacity="0.9"/>
    </g>
  </g>

  <!-- Accessibility: fallback background for non-SVG viewers (not necessary but harmless) -->
  <desc>Banner: Suliman Shams — Frontend Developer. Tech: React, TypeScript, Next.js.</desc>
</svg>
